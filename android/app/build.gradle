plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.arena.telegramuikit'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.arena.telegramuikit'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The prototype UI is generated from the Figma file into ../www
    sourceSets {
        main {
            assets.srcDirs = ['../www']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // signed with the debug key so the APK installs directly (prototype build)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
