name: extract-fig
on:
  push:
    paths:
      - '.github/workflows/inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ext:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: extract core design files
        run: |
          mkdir -p design
          unzip -o -j big.zip canvas.fig meta.json thumbnail.png -d design
          ls -l design
          python3 -c "import json;d=json.load(open('design/meta.json'));print(json.dumps(d)[:2000])" > design/meta_pretty.txt || true
      - name: publish
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f design
          git commit -m "chore: extract canvas.fig, meta.json, thumbnail" || echo none
          git push
