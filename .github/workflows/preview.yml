name: preview
on:
  push:
    paths:
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install tool deps
        working-directory: tools
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install sharp puppeteer kiwi-schema --no-audit --no-fund
      - name: generate screens from the .fig scene graph
        run: node tools/genapp.mjs
      - name: extract + downscale design images
        run: node tools/fetch-images.mjs
      - name: screenshots
        run: node tools/screenshots.mjs
      - name: publish previews
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          du -sh previews www/assets/img
          git add -f previews www/assets/img
          git commit -m "chore: extract design images + render screenshots" || echo "nothing to commit"
          git push
