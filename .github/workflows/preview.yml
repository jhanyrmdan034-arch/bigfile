name: preview
on:
  push:
    paths:
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install tool deps
        working-directory: tools
        run: |
          npm install sharp puppeteer kiwi-schema --no-audit --no-fund 2>&1 | tail -5
      - name: pipeline (gen screens + images + screenshots)
        run: |
          : > ci.log
          node tools/genapp.mjs 2>&1 | tee -a ci.log | tail -20
          node tools/fetch-images.mjs 2>&1 | tee -a ci.log | tail -20
          node tools/screenshots.mjs 2>&1 | tee -a ci.log | tail -60
      - name: publish results
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          du -sh previews www/assets/img 2>/dev/null || true
          git add -f ci.log previews www/assets/img 2>/dev/null || true
          git commit -m "chore: design images + rendered previews [skip ci]" || echo "nothing to commit"
          git push || (git pull --rebase -q && git push)
