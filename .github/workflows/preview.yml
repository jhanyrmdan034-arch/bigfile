name: preview
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install tool deps
        working-directory: tools
        run: |
          npm install sharp puppeteer kiwi-schema --no-audit --no-fund 2>&1 | tail -5
      - name: pipeline (gen screens + images + screenshots)
        continue-on-error: true
        run: |
          set -x
          echo "== versions ==" | tee ci.log
          node -v 2>&1 | tee -a ci.log
          ls tools 2>&1 | tee -a ci.log
          echo "== genapp ==" | tee -a ci.log
          node tools/genapp.mjs >> ci.log 2>&1 || echo "GENAPP_FAILED $?" | tee -a ci.log
          echo "== images ==" | tee -a ci.log
          node tools/fetch-images.mjs >> ci.log 2>&1 || echo "IMAGES_FAILED $?" | tee -a ci.log
          echo "== screenshots ==" | tee -a ci.log
          SHOTS="$(cat tools/shots.txt 2>/dev/null | tr -d '[:space:]')" node tools/screenshots.mjs >> ci.log 2>&1 || echo "SHOTS_FAILED $?" | tee -a ci.log
          tail -40 ci.log
      - name: publish results
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          du -sh previews www/assets/img 2>/dev/null || true
          git add -f ci.log || true
          [ -d previews ] && git add -f previews || true
          [ -d www/assets/img ] && git add -f www/assets/img || true
          git commit -m "chore: design images + rendered previews [skip ci]" || echo "nothing to commit"
          git push || (git pull --rebase -q && git push)

  apk:
    runs-on: ubuntu-latest
    needs: shots
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: pull generated previews/images (pushed by the shots job)
        run: git pull --rebase -q origin ${{ github.ref_name }} || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: android sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee -a ci.log
          ls "$ANDROID_HOME" 2>&1 | tee -a ci.log || true
          ls "$ANDROID_HOME/platforms" 2>&1 | tee -a ci.log || true
          ls "$ANDROID_HOME/build-tools" 2>&1 | tee -a ci.log || true
      - name: install tool deps
        working-directory: tools
        run: npm install kiwi-schema sharp --no-audit --no-fund 2>&1 | tail -3
      - name: generate the interface from the .fig file
        run: |
          node tools/genapp.mjs
          node tools/fetch-images.mjs
      - name: build the android app
        continue-on-error: true
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ( echo "== gradle version =="; gradle --version | head -8 ) 2>&1 | tee -a ../ci.log
          gradle :app:assembleRelease --no-daemon --stacktrace >> ../ci.log 2>&1 || echo "GRADLE_FAILED $?" | tee -a ../ci.log
          tail -40 ../ci.log
      - name: publish apk
        if: always()
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/Telegram-UI-Kit-1.0.apk" 2>/dev/null || echo "no apk produced"
          ls -lh apk
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f ci.log || true
          if ls apk/*.apk >/dev/null 2>&1; then git add -f apk/*.apk; fi
          git commit -m "release: signed prototype APK [skip ci]" || echo "nothing to commit"
          git push || (git pull --rebase -q && git push)
